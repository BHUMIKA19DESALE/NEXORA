<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - NEXORA</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/cart.css">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>

<body>
    <header class="navbar">
        <div class="navbar-container">
            <div class="logo">
                <a href="/">NEXORA</a>
            </div>

                        <nav class="nav-links">
                <a href="/">Home</a>
                <a href="/pages/shop.html">Shop</a>
                <a href="/pages/shop.html">Categories</a>
                <a href="/pages/vendor-register.html">Vendors</a>
                <a href="/pages/shop.html?deals=true">Deals</a>
            </nav>

            <div class="search-bar">
                <form action="/pages/shop.html" method="GET" style="display:flex; width:100%; margin:0; padding:0; border:none; background:transparent;">
                    <input type="text" name="search" placeholder="Search products, brands and more..." style="border:none; flex:1;">
                    <button type="submit" style="border:none; background:transparent; cursor:pointer;"><i class='bx bx-search'></i></button>
                </form>
            </div>

            <div class="nav-actions">
                <a href="/pages/wishlist.html" class="icon-btn"><i class='bx bx-heart'></i></a>
                <a href="/pages/cart.html" class="icon-btn"><i class='bx bx-cart'></i><span id="nav-cart-count"
                        style="display:none; position:absolute; top:-5px; right:-5px; background:var(--color-danger); color:white; border-radius:50%; font-size:10px; width:16px; height:16px; align-items:center; justify-content:center;"></span></a>
                <a href="/pages/login.html" class="icon-btn" id="account-btn"><i class='bx bx-user'></i></a>
            </div>
        </div>
    </header>

    <main class="container section">
        <div class="section-header">
            <h2>Your Shopping Cart</h2>
        </div>
        
        <div id="cart-container" style="display: flex; gap: var(--spacing-xl); flex-wrap: wrap;">
            <div id="cart-items" style="flex: 2; min-width: 300px;">
                <!-- Cart items will be injected here -->
                <div class="skeleton skeleton-text" style="height: 100px; margin-bottom: 10px;"></div>
                <div class="skeleton skeleton-text" style="height: 100px; margin-bottom: 10px;"></div>
            </div>
            
            <div class="cart-summary card" style="flex: 1; min-width: 300px; padding: var(--spacing-lg); height: fit-content;">
                <h3>Order Summary</h3>
                <div style="display: flex; justify-content: space-between; margin-top: var(--spacing-md);">
                    <span>Subtotal</span>
                    <span id="cart-subtotal">₹0.00</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-top: var(--spacing-sm);">
                    <span>Shipping</span>
                    <span id="cart-shipping">Calculated at checkout</span>
                </div>
                <hr style="margin: var(--spacing-md) 0; border: none; border-top: 1px solid var(--color-border);">
                <div style="display: flex; justify-content: space-between; font-weight: 600; font-size: 1.25rem;">
                    <span>Total</span>
                    <span id="cart-total">₹0.00</span>
                </div>
                <a href="/pages/checkout.html" class="btn btn-primary" style="width: 100%; margin-top: var(--spacing-lg);">Proceed to Checkout</a>
            </div>
        </div>
        <div id="cart-empty" style="display: none; text-align: center; padding: var(--spacing-xxl);">
            <i class='bx bx-cart' style="font-size: 4rem; color: var(--color-text-muted);"></i>
            <h3>Your cart is empty</h3>
            <p>Looks like you haven't added anything yet.</p>
            <a href="/pages/shop.html" class="btn btn-primary" style="margin-top: var(--spacing-md);">Continue Shopping</a>
        </div>
    </main>

    <script src="../js/ui.js" type="module"></script>
    <script src="../js/cart.js" type="module"></script>
</body>

</html>
