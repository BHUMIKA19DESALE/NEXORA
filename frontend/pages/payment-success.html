<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Success - NEXORA</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/components.css">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <style>
        .success-container {
            max-width: 600px;
            margin: 4rem auto;
            text-align: center;
            padding: var(--spacing-xl);
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--color-border);
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: var(--color-success);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin: 0 auto var(--spacing-lg);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .success-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--color-text);
            margin-bottom: var(--spacing-sm);
        }

        .success-message {
            color: var(--color-text-secondary);
            font-size: 1.1rem;
            margin-bottom: var(--spacing-xl);
        }

        .order-details {
            background: var(--color-bg);
            padding: var(--spacing-lg);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-xl);
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: var(--spacing-sm);
            padding-bottom: var(--spacing-sm);
            border-bottom: 1px dashed var(--color-border);
        }

        .detail-row:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .detail-label {
            color: var(--color-text-secondary);
            font-weight: 500;
        }

        .detail-value {
            font-weight: 600;
            color: var(--color-text);
        }

        .actions {
            display: flex;
            gap: var(--spacing-md);
            justify-content: center;
        }
    </style>
</head>

<body>
    <header class="navbar">
        <div class="navbar-container">
            <div class="logo">
                <a href="/">NEXORA</a>
            </div>

            <nav class="nav-links">
                <a href="/">Home</a>
                <a href="/pages/shop.html">Shop</a>
                <a href="/pages/shop.html">Categories</a>
                <a href="/pages/vendor-register.html">Vendors</a>
            </nav>

            <div class="nav-actions">
                <a href="/pages/orders.html" class="icon-btn"><i class='bx bx-shopping-bag'></i></a>
                <a href="/pages/login.html" class="icon-btn" id="account-btn"><i class='bx bx-user'></i></a>
            </div>
        </div>
    </header>

    <main class="container section">
        <div class="success-container">
            <div class="success-icon">
                <i class='bx bx-check'></i>
            </div>
            <h1 class="success-title">Payment Successful!</h1>
            <p class="success-message">Thank you for your purchase. Your order has been confirmed.</p>

            <div class="order-details">
                <div class="detail-row">
                    <span class="detail-label">Order ID:</span>
                    <span class="detail-value" id="display-order-id">Loading...</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Payment Reference:</span>
                    <span class="detail-value" id="display-payment-ref">Loading...</span>
                </div>
            </div>

            <div class="actions">
                <a href="/pages/orders.html" class="btn btn-primary">View Orders</a>
                <a href="/pages/shop.html" class="btn btn-outline">Continue Shopping</a>
            </div>
        </div>
    </main>

    <script src="../js/ui.js" type="module"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('order_id');
            const paymentRef = urlParams.get('payment_ref');
            
            if(orderId) document.getElementById('display-order-id').innerText = orderId;
            if(paymentRef) document.getElementById('display-payment-ref').innerText = paymentRef;
        });
    </script>
</body>

</html>
