<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product - NEXORA</title>
    
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/product.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="navbar-container">
            <div class="logo">
                <a href="/">NEXORA</a>
            </div>
            
                        <nav class="nav-links">
                <a href="/">Home</a>
                <a href="/pages/shop.html">Shop</a>
                <a href="/pages/shop.html">Categories</a>
                <a href="/pages/vendor-register.html">Vendors</a>
                <a href="/pages/shop.html?deals=true">Deals</a>
            </nav>
            
            <div class="nav-actions">
                <a href="/pages/wishlist.html" class="icon-btn"><i class='bx bx-heart'></i></a>
                <a href="/pages/cart.html" class="icon-btn"><i class='bx bx-cart'></i></a>
                <a href="/pages/login.html" class="icon-btn" id="account-btn"><i class='bx bx-user'></i></a>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="product-loading" class="product-layout">
            <div class="product-gallery skeleton"></div>
            <div class="product-info">
                <div class="skeleton skeleton-text" style="width: 30%; height:20px;"></div>
                <div class="skeleton skeleton-text" style="width: 80%; height:40px; margin-top:8px;"></div>
                <div class="skeleton skeleton-text" style="width: 40%; height:30px; margin-top:16px;"></div>
            </div>
        </div>

        <div id="product-content" style="display: none;">
            <div class="breadcrumb" id="breadcrumb">
                <a href="/">Home</a> / <a href="/pages/shop.html">Shop</a> / <span id="bc-name"></span>
            </div>
            
            <div class="product-layout">
                <div class="product-gallery">
                    <img id="main-image" src="" alt="Product">
                </div>
                
                <div class="product-info">
                    <div class="brand" id="p-brand"></div>
                    <h1 class="title" id="p-name"></h1>
                    
                    <div class="rating-row" style="margin: var(--spacing-sm) 0;">
                        <div class="stars" id="p-stars"></div>
                        <span id="p-reviews-count">(No reviews yet)</span>
                    </div>
                    
                    <div class="price-display">
                        <span class="current-price" id="p-price"></span>
                        <span class="original-price" id="p-original-price"></span>
                        <span class="discount-badge" id="p-discount" style="display:none;"></span>
                    </div>
                    
                    <div class="stock-status" id="p-stock">
                        In Stock
                    </div>
                    
                    <div class="description" id="p-desc"></div>
                    
                    <div class="actions">
                        <div class="quantity-selector">
                            <button id="qty-minus">-</button>
                            <input type="number" id="qty-input" value="1" min="1" max="10">
                            <button id="qty-plus">+</button>
                        </div>
                        
                        <div class="btn-group" style="display:flex; gap:var(--spacing-md); margin-top:var(--spacing-lg);">
                            <button class="btn btn-primary" id="btn-add-cart" style="flex:1;">
                                <i class='bx bx-cart-add'></i> Add to Cart
                            </button>
                            <button class="icon-btn" id="btn-wishlist" style="border:1px solid var(--color-border);">
                                <i class='bx bx-heart'></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="vendor-info" style="margin-top:var(--spacing-xl); padding-top:var(--spacing-lg); border-top:1px solid var(--color-border);">
                        Sold by <span style="font-weight:600;">NEXORA Verified Vendor</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="product-error" class="empty-state" style="display:none; margin-top:var(--spacing-xl);">
            <h3 style="color:var(--color-danger)">Product not found</h3>
            <p>The product you are looking for does not exist or has been removed.</p>
            <a href="/pages/shop.html" class="btn btn-primary" style="margin-top:1rem;">Back to Shop</a>
        </div>
    </main>

    <script src="../js/ui.js" type="module"></script>
    <script src="../js/product.js" type="module"></script>
</body>
</html>
